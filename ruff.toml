line-length = 132
target-version = "py314"

[lint]
# Включаем популярные правила:
# E (Error), F (Pyflakes), W (Warning), I (Isort), B (Bugbear), UP (Upgrade), Q (Flake8-quotes)
select = ["E", "F", "W", "I", "B", "UP", "Q"]
ignore = []

# [lint.isort]
# Настройка порядка импортов, чтобы они соответствовали стандартам
# known-first-party = ["smg"]

[lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "double"
docstring-quotes = "double"

[format]
quote-style = "single"
